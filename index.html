<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BIG3 training log" />
    <title>Strength Log | BIG 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar"><a class="brand" href="#top" aria-label="Strength Log ホーム">STRENGTH LOG</a><p class="updated" id="updated-label"></p></header>

      <section class="hero" id="top">
        <div>
          <p class="eyebrow">BIG THREE</p>
          <h1>TRAIN.<br /><em>REPEAT.</em></h1>
        </div>
        <div class="total-card">
          <p class="card-label">TOTAL</p>
          <strong id="total-value">0<span>kg</span></strong>
          <p id="total-detail"></p>
        </div>
      </section>

      <section class="lift-grid" aria-label="BIG3の現在値">
        <article class="lift-card squat">
          <div class="lift-card-heading"><p>SQUAT</p><span>01</span></div>
          <strong id="squat-current">--<small>kg</small></strong>
          <p id="squat-change"></p>
        </article>
        <article class="lift-card bench">
          <div class="lift-card-heading"><p>BENCH PRESS</p><span>02</span></div>
          <strong id="bench-current">--<small>kg</small></strong>
          <p id="bench-change"></p>
        </article>
        <article class="lift-card deadlift">
          <div class="lift-card-heading"><p>DEADLIFT</p><span>03</span></div>
          <strong id="deadlift-current">--<small>kg</small></strong>
          <p id="deadlift-change"></p>
        </article>
      </section>

      <section class="dashboard-grid">
        <article class="panel progress-panel">
          <div class="section-heading"><h2 id="chart-title">TOTAL</h2><span class="goal-key">◇</span></div>
          <div class="chart-tabs" role="tablist" aria-label="グラフの種目を選ぶ">
            <button class="chart-tab active" data-lift="total" role="tab" aria-selected="true">TOTAL</button>
            <button class="chart-tab" data-lift="squat" role="tab" aria-selected="false">S</button>
            <button class="chart-tab" data-lift="bench" role="tab" aria-selected="false">B</button>
            <button class="chart-tab" data-lift="deadlift" role="tab" aria-selected="false">D</button>
          </div>
          <div class="chart-wrap"><svg id="progress-chart" viewBox="0 0 720 280" role="img" aria-label="BIG3重量の推移グラフ"></svg><p class="empty-chart" id="empty-chart"></p></div>
        </article>

      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
