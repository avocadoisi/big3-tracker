<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <rect width="32" height="32" rx="5" fill="#101010"/>
  <!-- plates -->
  <rect x="2" y="3" width="2" height="16" fill="#b5d36a"/><rect x="28" y="3" width="2" height="16" fill="#b5d36a"/>
  <rect x="4" y="5" width="2" height="12" fill="#7f9a45"/><rect x="26" y="5" width="2" height="12" fill="#7f9a45"/>
  <rect x="6" y="7" width="2" height="8" fill="#b5d36a"/><rect x="24" y="7" width="2" height="8" fill="#b5d36a"/>
  <rect x="8" y="9" width="2" height="4" fill="#f4f4f1"/><rect x="22" y="9" width="2" height="4" fill="#f4f4f1"/>
  <!-- head -->
  <rect x="13" y="2" width="6" height="1" fill="#f4f4f1"/>
  <rect x="12" y="3" width="8" height="4" fill="#f4f4f1"/>
  <rect x="13" y="7" width="6" height="1" fill="#f4f4f1"/>
  <rect x="14" y="8" width="4" height="2" fill="#f4f4f1"/>
  <!-- torso -->
  <rect x="12" y="9" width="8" height="9" fill="#f4f4f1"/>
  <rect x="13" y="18" width="6" height="1" fill="#f4f4f1"/>
  <!-- belt -->
  <rect x="12" y="16" width="8" height="2" fill="#4d5a2c"/>
  <rect x="15" y="16" width="2" height="2" fill="#b5d36a"/>
  <!-- hips -->
  <rect x="10" y="19" width="12" height="2" fill="#f4f4f1"/>
  <!-- legs (squat, knees out) -->
  <rect x="10" y="21" width="6" height="1" fill="#f4f4f1"/><rect x="16" y="21" width="6" height="1" fill="#f4f4f1"/>
  <rect x="9" y="22" width="6" height="1" fill="#f4f4f1"/><rect x="17" y="22" width="6" height="1" fill="#f4f4f1"/>
  <rect x="8" y="23" width="6" height="1" fill="#f4f4f1"/><rect x="18" y="23" width="6" height="1" fill="#f4f4f1"/>
  <rect x="7" y="24" width="6" height="1" fill="#f4f4f1"/><rect x="19" y="24" width="6" height="1" fill="#f4f4f1"/>
  <rect x="6" y="25" width="7" height="2" fill="#f4f4f1"/><rect x="19" y="25" width="7" height="2" fill="#f4f4f1"/>
  <rect x="6" y="27" width="4" height="2" fill="#f4f4f1"/><rect x="22" y="27" width="4" height="2" fill="#f4f4f1"/>
  <rect x="5" y="29" width="7" height="2" fill="#f4f4f1"/><rect x="20" y="29" width="7" height="2" fill="#f4f4f1"/>
  <!-- bar across the back, hands on it -->
  <rect x="6" y="10" width="20" height="2" fill="#c9c9c4"/>
  <rect x="10" y="9" width="2" height="3" fill="#f4f4f1"/><rect x="20" y="9" width="2" height="3" fill="#f4f4f1"/>
  <rect x="2" y="31" width="28" height="1" fill="#2a2a2a"/>
</svg>
